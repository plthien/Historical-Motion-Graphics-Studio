components:
  schemas:
    ApproveSceneBreakdownRequestV4:
      properties:
        expected_scene_plan_artifact_id:
          type: string
          title: Expected Scene Plan Artifact Id
        expected_visual_plan_artifact_id:
          type: string
          title: Expected Visual Plan Artifact Id
        aspect_ratio:
          type: string
          enum:
          - '1:1'
          - '3:4'
          - '4:3'
          - '9:16'
          - '16:9'
          title: Aspect Ratio
      additionalProperties: false
      type: object
      required:
      - expected_scene_plan_artifact_id
      - expected_visual_plan_artifact_id
      - aspect_ratio
      title: ApproveSceneBreakdownRequestV4
    ArtifactDownloadResponse:
      properties:
        artifact_id:
          type: string
          title: Artifact Id
        download_url:
          type: string
          title: Download Url
        expires_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Expires At
        sha256:
          anyOf:
          - type: string
          - type: 'null'
          title: Sha256
      additionalProperties: false
      type: object
      required:
      - artifact_id
      - download_url
      title: ArtifactDownloadResponse
    ArtifactListResponse:
      properties:
        items:
          items:
            $ref: '#/components/schemas/ArtifactModel'
          type: array
          title: Items
        page:
          type: integer
          title: Page
        page_size:
          type: integer
          title: Page Size
        total:
          type: integer
          title: Total
      additionalProperties: false
      type: object
      required:
      - items
      - page
      - page_size
      - total
      title: ArtifactListResponse
    ArtifactModel:
      properties:
        artifact_id:
          type: string
          title: Artifact Id
        logical_id:
          type: string
          title: Logical Id
        version_no:
          type: integer
          title: Version No
        is_current:
          type: boolean
          title: Is Current
        artifact_type:
          type: string
          title: Artifact Type
        artifact_role:
          anyOf:
          - type: string
          - type: 'null'
          title: Artifact Role
        status:
          type: string
          title: Status
        created_at:
          type: string
          title: Created At
        path:
          anyOf:
          - type: string
          - type: 'null'
          title: Path
      additionalProperties: false
      type: object
      required:
      - artifact_id
      - logical_id
      - version_no
      - is_current
      - artifact_type
      - status
      - created_at
      title: ArtifactModel
    AssemblyApproveRequest:
      properties:
        expected_assembly_plan_artifact_id:
          type: string
          title: Expected Assembly Plan Artifact Id
        expected_subtitle_srt_artifact_id:
          type: string
          title: Expected Subtitle Srt Artifact Id
        expected_subtitle_vtt_artifact_id:
          type: string
          title: Expected Subtitle Vtt Artifact Id
      additionalProperties: false
      type: object
      required:
      - expected_assembly_plan_artifact_id
      - expected_subtitle_srt_artifact_id
      - expected_subtitle_vtt_artifact_id
      title: AssemblyApproveRequest
    AssemblyBuildRequest:
      properties:
        expected_assembly_plan_artifact_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Expected Assembly Plan Artifact Id
        expected_subtitle_srt_artifact_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Expected Subtitle Srt Artifact Id
        expected_subtitle_vtt_artifact_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Expected Subtitle Vtt Artifact Id
        expected_scene_plan_artifact_id:
          type: string
          title: Expected Scene Plan Artifact Id
        expected_scene_asset_manifest_artifact_id:
          type: string
          title: Expected Scene Asset Manifest Artifact Id
        expected_narration_audio_artifact_id:
          type: string
          title: Expected Narration Audio Artifact Id
        expected_narration_word_timing_map_artifact_id:
          type: string
          title: Expected Narration Word Timing Map Artifact Id
        expected_beat_timing_map_artifact_id:
