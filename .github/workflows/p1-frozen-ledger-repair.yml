name: P1 frozen P0 ledger repair evidence (temporary)
on:
  push:
    branches: [feat/p1-atomic-history-clean-cut]
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate immutable P0 doc classification from frozen donor
        run: python tools/history_p0_source_audit.py --emit
