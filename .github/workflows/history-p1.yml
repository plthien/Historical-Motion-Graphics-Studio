name: Historical Studio P1 strict acceptance
on:
  push:
    branches: [feat/p1-atomic-history-clean-cut]
  pull_request:
    paths:
      - 'app/**'
      - 'src/**'
      - 'tests/history/**'
      - 'tests/history-ui/**'
      - 'contracts/history/**'
      - 'alembic/**'
      - 'package*.json'
      - '.github/workflows/history-p1.yml'
      - 'scripts/windows/start-history.ps1'
permissions:
  contents: read
jobs:
  history-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Exact candidate SHA
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          echo "P1_EXACT_SHA=$(git rev-parse HEAD)"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install History-only dependencies
        run: |
          python -m pip install -r requirements.txt
          npm ci --no-audit --no-fund
      - name: Governance and source/runtime closure
        run: |
          python tools/check_history_governance.py
          python tools/check_history_p1_closure.py
          python tools/history_p0_source_audit.py --verify
      - name: History tests + DB data isolation
        run: python -m pytest -q tests/history
      - name: Frontend tests and type-safe build
        run: |
          npm test
          npm run build
      - name: Install Chromium for UI smoke
        run: npx playwright install --with-deps chromium
      - name: Live History Cockpit screenshots + backend restart
        run: npm run test:ui
      - name: P0 Remotion neutral regression
        working-directory: experiments/remotion-history-poc
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          npm ci --no-audit --no-fund
          npm test
          npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p1-ui-linux-${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          path: out/p1-ui
          if-no-files-found: ignore
  history-windows:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Exact candidate SHA
        shell: pwsh
        run: |
          if ((git rev-parse HEAD) -ne "${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}") { throw "P1_SHA_MISMATCH" }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Windows History dependencies
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt
          npm ci --no-audit --no-fund
      - name: History tests, build and process closure
        shell: pwsh
        run: |
          python -m pytest -q tests/history/test_history_api.py tests/history/test_p1_source_closure.py
          npm test
          npm run build
          python tools/check_history_p1_closure.py
      - name: Windows launcher preflight and real start/restart/shutdown
        shell: pwsh
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/windows/start-history.ps1 -CheckOnly
          if ($LASTEXITCODE -ne 0) {throw "HISTORY_WINDOWS_CHECK_FAILED"}
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/windows/start-history.ps1 -Smoke
          if ($LASTEXITCODE -ne 0) {throw "HISTORY_WINDOWS_LIFECYCLE_FAILED"}
