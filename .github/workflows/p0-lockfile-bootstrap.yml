name: P0 lockfile bootstrap (temporary)
on:
  push:
    branches: [feat/p0-history-remotion-feasibility]
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve reproducible lockfile, emit for branch commit
        working-directory: experiments/remotion-history-poc
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          echo 'P0_LOCK_BEGIN'
          cat package-lock.json
          echo 'P0_LOCK_END'
