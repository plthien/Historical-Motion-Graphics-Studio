name: History Remotion P0 proof
on:
  push:
    branches: [feat/p0-history-remotion-feasibility]
  pull_request:
    paths:
      - 'experiments/remotion-history-poc/**'
      - '.github/workflows/history-remotion-poc.yml'
permissions:
  contents: read
jobs:
  remotion-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - name: Checkout exact PR branch HEAD (not synthetic merge)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Assert tested SHA
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          expected="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          echo "P0_EXACT_CANDIDATE_SHA=$actual"
          test "$actual" = "$expected"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: experiments/remotion-history-poc/package-lock.json
      - name: Immutable donor ledger verification
        run: |
          python tools/history_p0_source_audit.py --verify
          python tools/check_history_governance.py
      - name: Exact lockfile required
        working-directory: experiments/remotion-history-poc
        run: test -f package-lock.json
      - name: npm ci
        working-directory: experiments/remotion-history-poc
        run: npm ci --no-audit --no-fund
      - name: Motion Plan tests
        working-directory: experiments/remotion-history-poc
        run: npm test
      - name: Vite build
        working-directory: experiments/remotion-history-poc
        run: npm run build
      - name: Chromium prerequisites for Player
        working-directory: experiments/remotion-history-poc
        run: npx playwright install --with-deps chromium
      - name: Actual browser Remotion Player smoke
        working-directory: experiments/remotion-history-poc
        run: npm run test:player
      - name: Remotion Chrome Headless Shell
        working-directory: experiments/remotion-history-poc
        run: npx remotion browser ensure
      - name: Render 1800 real frames
        working-directory: experiments/remotion-history-poc
        run: npm run render
      - name: Install independent Linux FFmpeg and FFprobe
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          command -v ffprobe
          command -v ffmpeg
      - name: Independent FFprobe + full video decode
        working-directory: experiments/remotion-history-poc
        run: npm run verify:video
      - name: Visual parity dependencies
        run: python -m pip install --disable-pip-version-check pillow==11.3.0
      - name: Full-resolution Player-versus-MP4 parity
        working-directory: experiments/remotion-history-poc
        run: python scripts/visual-parity.py
      - name: Representative output frames
        working-directory: experiments/remotion-history-poc
        run: |
          mkdir -p out/frames
          for sec in 0 5 10 19 20 25 35 39 40 45 55 59; do
            printf -v pad '%02d' "$sec"
            ffmpeg -v error -ss "$sec" -i out/history-poc.mp4 -frames:v 1 -y "out/frames/${pad}s.png"
          done
          actual="$(find out/frames -name '*s.png' -printf '%f\n' | sort | tr '\n' ' ')"
          expected='00s.png 05s.png 10s.png 19s.png 20s.png 25s.png 35s.png 39s.png 40s.png 45s.png 55s.png 59s.png '
          test "$actual" = "$expected"
          echo "P0_CONTACT_SHEET_ORDER=$actual"
          ffmpeg -y -v error -pattern_type glob -i 'out/frames/*.png' -vf 'scale=480:270,tile=3x4' -frames:v 1 out/contact-sheet.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p0-linux-${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          path: experiments/remotion-history-poc/out/
          if-no-files-found: ignore
  remotion-windows:
    runs-on: windows-2022
    timeout-minutes: 100
    steps:
      - name: Checkout exact PR branch HEAD (not synthetic merge)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Assert tested SHA
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          expected="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          echo "P0_EXACT_CANDIDATE_SHA=$actual"
          test "$actual" = "$expected"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: npm ci, tests and Vite
        working-directory: experiments/remotion-history-poc
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run build
      - name: Install independent FFprobe/FFmpeg on Windows
        shell: pwsh
        run: |
          if (!(Get-Command ffprobe -ErrorAction SilentlyContinue)) {
            for ($attempt=1; $attempt -le 3; $attempt++) {
              choco install ffmpeg -y --no-progress --ignore-package-exit-codes
              if (Get-Command ffprobe -ErrorAction SilentlyContinue) { break }
              Write-Warning "Chocolatey unavailable, retry $attempt/3"
              Start-Sleep -Seconds 8
            }
          }
          if (!(Get-Command ffprobe -ErrorAction SilentlyContinue)) { throw "FFPROBE_PREREQUISITE_UNAVAILABLE after 3 Chocolatey attempts" }
      - name: Windows Remotion render and FFprobe
        working-directory: experiments/remotion-history-poc
        run: |
          npx remotion browser ensure
          npm run render
          npm run verify:video
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p0-windows-${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          path: experiments/remotion-history-poc/out/
          if-no-files-found: ignore
