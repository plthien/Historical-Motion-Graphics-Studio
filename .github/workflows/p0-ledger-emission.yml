name: P0 donor document ledger emission (temporary)
on:
  push:
    branches: [feat/p0-history-remotion-feasibility]
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Emit complete immutable donor ledger
        run: python tools/history_p0_source_audit.py --emit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p0-donor-doc-ledger
          path: docs/history/source-ownership-ledger.json
