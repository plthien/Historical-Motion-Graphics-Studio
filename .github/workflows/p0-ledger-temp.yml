name: P0 immutable source ledger export (temporary)
on:
  push:
    branches: [feat/p0-history-remotion-feasibility]
permissions:
  contents: read
jobs:
  freeze:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate frozen donor audit
        run: python tools/history_p0_source_audit.py --emit
      - uses: actions/upload-artifact@v4
        with:
          name: p0-frozen-donor-ledger
          path: docs/history/source-ownership-ledger.json
